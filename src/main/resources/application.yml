spring:
  application:
    name: aegis
  # 기본 활성 프로파일은 dev (운영은 --spring.profiles.active=prod 로 띄운다)
  profiles:
    default: dev
  jackson:
    deserialization:
      # 화이트리스트: 정의되지 않은(예상치 못한) JSON 필드가 오면 요청을 거부한다.
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway로만 관리한다. Hibernate는 검증만 (자동 생성/변경 금지).
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Actuator: health/info/prometheus 만 노출하고 나머지는 막는다.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 보안 관련 커스텀 설정 (단계별로 사용)
aegis:
  security:
    # 차단/레이트리밋 면제 IP(정확 일치). 예: ["127.0.0.1", "10.0.0.5"]
    whitelist: []
    alert:
      # 중대 보안 이벤트(IP 차단/토큰 재사용) 알림 웹훅. 비우면 비활성.
      # 예: https://hooks.slack.com/services/... 또는 자체 수집 서버 URL
      webhook-url: ${AEGIS_ALERT_WEBHOOK:}
    jwt:
      # dev 기본값. 운영(prod)에서는 환경변수로 반드시 덮어쓴다. 평문 커밋 금지.
      secret: ${AEGIS_JWT_SECRET:dev-only-change-me-in-production-32bytes-min}
      expiration-minutes: 30
      refresh-expiration-minutes: 10080   # 7일
    lockout:
      max-failed-attempts: 5
      lock-minutes: 15
    rate-limit:
      requests-per-minute: 60
    bruteforce:
      ip-fail-threshold: 10
      ip-block-minutes: 10
      ip-fail-window-minutes: 10

server:
  port: 8080
